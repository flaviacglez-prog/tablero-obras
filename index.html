<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<div id="cover" aria-hidden="true"><img src="logo-ucc.svg" alt=""></div>
<title>OFICINA TÉCNICA - Tablero de obras</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: herramienta de lectura rápida — encabezado con resumen, barra de filtros fija, obras agrupadas por sede en filas de dos zonas (lectura | asignación) */
:root{
  --bg:#f2f5f9; --surface:#ffffff; --surface-2:#e6ecf3; --line:#d2dbe6;
  --fg:#0d1f33; --muted:#566678; --accent:#002C55; --accent-soft:#d8e6f4;
  --obra:#2f6b35; --obra-soft:#e3f0de;
  --martin:#b42318; --martin-soft:#fbe9e7;
  --ot:#1d4ed8; --ot-soft:#e5ecfd;
  --warn:#9a6700; --warn-soft:#fdf2d6;
  --p:#3d7f5a; --m:#b07a12; --g:#b3402a;
  --f-display:"Montserrat", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Montserrat", "Segoe UI", Arial, sans-serif;
  --r:10px; --total-bg:#002C55; --plan:#00A4EB;
  --e1b:#b3261e; --e1f:#ffffff; --e2b:#d4edbc; --e2f:#1e5a1e; --e3b:#ffcfc9; --e3f:#8a1c12; --e4b:#11734b; --e4f:#ffffff; --e5b:#bfe1f6; --e5f:#0b4f7c; --e6b:#0a53a8; --e6f:#ffffff; --e7b:#ffe5a0; --e7f:#6b4a00; --e8b:#4b5459; --e8f:#ffffff; --e9b:#e4d7f5; --e9f:#4b2a7a;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1626; --surface:#102238; --surface-2:#17304c; --line:#26405e;
  --fg:#e8eff7; --muted:#9db0c6; --accent:#4cc3f5; --accent-soft:#12324d;
  --obra:#8fcf87; --obra-soft:#1f3020;
  --martin:#ff8a7a; --martin-soft:#3a1f1c;
  --ot:#8fb0ff; --ot-soft:#1c2540;
  --warn:#f0c35a; --warn-soft:#3a2f12;
  --p:#7bcf9c; --m:#f0b950; --g:#ff8e72; --total-bg:#0b4a85; --plan:#00A4EB; --e1b:#c9382f; --e1f:#ffffff; --e2b:#2c4a22; --e2f:#bfe6a8; --e3b:#4d2420; --e3f:#ffb4aa; --e4b:#1c8a5c; --e4f:#ffffff; --e5b:#173c56; --e5f:#a8d8f7; --e6b:#2f6fc4; --e6f:#ffffff; --e7b:#4a3c12; --e7f:#ffdf8a; --e8b:#79838a; --e8f:#ffffff; --e9b:#3a2a52; --e9f:#d9c4f7; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1626; --surface:#102238; --surface-2:#17304c; --line:#26405e;
  --fg:#e8eff7; --muted:#9db0c6; --accent:#4cc3f5; --accent-soft:#12324d;
  --obra:#8fcf87; --obra-soft:#1f3020;
  --martin:#ff8a7a; --martin-soft:#3a1f1c;
  --ot:#8fb0ff; --ot-soft:#1c2540;
  --warn:#f0c35a; --warn-soft:#3a2f12;
  --p:#7bcf9c; --m:#f0b950; --g:#ff8e72; --total-bg:#0b4a85; --plan:#00A4EB; --e1b:#c9382f; --e1f:#ffffff; --e2b:#2c4a22; --e2f:#bfe6a8; --e3b:#4d2420; --e3f:#ffb4aa; --e4b:#1c8a5c; --e4f:#ffffff; --e5b:#173c56; --e5f:#a8d8f7; --e6b:#2f6fc4; --e6f:#ffffff; --e7b:#4a3c12; --e7f:#ffdf8a; --e8b:#79838a; --e8f:#ffffff; --e9b:#3a2a52; --e9f:#d9c4f7; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:12.5px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:22px 12px;display:grid;gap:18px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(22px,3.6vw,32px);margin:2px 0 0;letter-spacing:-.01em;text-wrap:balance;color:var(--accent);text-transform:uppercase}
.brand{display:flex;align-items:stretch;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
.logo{display:block;height:60px;width:auto;max-width:100%;margin-left:auto}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:brightness(0) invert(1)}}
:root[data-theme="dark"] .logo{filter:brightness(0) invert(1)}
.brand-t{min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between}
.brand-t .eyebrow{line-height:1;margin-top:calc(2.5px - .1585em)}
.brand-t h1{line-height:1;margin:0 0 calc(2.7px - .1415em)}
.brand-t .eyebrow,.brand-t h1{white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}

.stats{display:grid;grid-template-columns:136px minmax(0,1.2fr) minmax(0,.85fr) minmax(0,1.9fr) minmax(0,1.5fr);gap:12px;align-items:stretch}
@media (max-width:1200px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.c-etapa{grid-column:span 2}}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.c-etapa{grid-column:1/-1}}
@media (max-width:520px){.stats{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;gap:10px;min-width:0}
.card>:nth-child(2){align-self:center}
.card h3{margin:0;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.card.c-total{background:var(--total-bg);border-color:var(--total-bg);color:#ffffff}
.card.c-total h3,.card.c-total .sub{color:#ffffff;opacity:.92}
.card.c-total .sub{white-space:nowrap}
.card.c-total{grid-template-rows:auto 1fr auto}
.card.c-total .big{align-self:center;font-size:52px}
.big{font-family:var(--f-display);font-size:44px;font-weight:800;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.card .sub{font-size:11px;color:var(--muted)}
.sbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface-2);gap:2px}
.sbar i{display:block;height:100%;min-width:3px}
.lgs{display:grid;gap:1px}
.lgs.cols{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:14px}
.lg{font:inherit;display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;background:none;border:0;border-radius:6px;padding:3px 6px;margin:0 -6px;color:var(--fg);cursor:pointer;font-size:11.5px}
.lg i{width:10px;height:10px;border-radius:3px;border:1px solid rgba(0,0,0,.08)}
.lg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg b{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-size:12.5px}
.lg:hover{background:var(--surface-2)}
.lg[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.lg.zero{color:var(--muted);opacity:.6}
.bubs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;gap:8px;min-height:80px}
.bub{font:inherit;background:none;border:0;display:grid;justify-items:center;align-content:end;gap:5px;cursor:pointer;padding:4px 2px;min-width:0;border-radius:8px;color:var(--fg)}
.ring{position:relative;width:60px;height:60px;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:var(--surface-2);stroke-width:6}
.ring .ar{fill:none;stroke-width:6;stroke-linecap:round}
.ring b{position:relative;font:800 15px var(--f-display);font-variant-numeric:tabular-nums}
.bub-c{flex:none;max-width:100%;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 13.5px var(--f-display);font-variant-numeric:tabular-nums}
.bub-l{font-size:10.5px;font-weight:600}
.colb{font:inherit;background:none;border:0;display:grid;grid-template-rows:auto 64px auto;justify-items:center;gap:4px;cursor:pointer;padding:4px 2px;border-radius:8px;color:var(--fg)}
.colb b{font:800 14.5px var(--f-display);font-variant-numeric:tabular-nums}
.colb-t{width:30px;height:64px;display:flex;align-items:flex-end;background:var(--surface-2);border-radius:5px 5px 2px 2px;overflow:hidden}
.colb-t i{display:block;width:100%;border-radius:5px 5px 0 0}
.colb-l{font-size:11px;font-weight:600}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px}
.cols3 .colb{padding:0}
.hbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:18px;row-gap:3px;align-self:center}
.hb{font:inherit;background:none;border:0;display:grid;grid-template-columns:minmax(0,1fr) 24px 18px;gap:6px;align-items:center;cursor:pointer;padding:3px 6px;margin:0 -6px;border-radius:6px;color:var(--fg);font-size:11px;text-align:left}
.hb-l{white-space:normal;line-height:1.15;font-size:11px}
.hb-t{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;display:block}
.hb-t i{display:block;height:100%;border-radius:4px}
.hb b{font:800 12.5px var(--f-display);text-align:right;font-variant-numeric:tabular-nums}
.card.c-lleva{grid-template-rows:auto 1fr}
.dn-w{display:flex;align-items:center;justify-content:center;gap:14px;align-self:center}
.dn-w .lg span{white-space:normal;line-height:1.2}
.dn{flex:none;width:74px;height:74px;border-radius:50%;display:grid;place-items:center}
.dn span{width:52px;height:52px;border-radius:50%;background:var(--surface);display:grid;place-items:center;align-content:center;line-height:1}
.dn b{font:800 15.5px var(--f-display)}
.dn small{font-size:10px;color:var(--muted);font-weight:700}
.c-lleva .dn{width:80px;height:80px}
.c-lleva .dn span{width:55px;height:55px}
.c-lleva .dn b{font-size:16px}
.c-lleva .dn small{font-size:10px}
.c-lleva .dn-w{gap:12px;justify-content:flex-start}
.c-lleva .lgs{gap:6px}
.c-lleva .lg{grid-template-columns:14px minmax(0,1fr) auto;gap:8px;padding:2px 4px;margin:0 -4px;font-size:12px}
.c-lleva .lg i{width:14px;height:14px;border-radius:4px}
.c-lleva .lg b{font-size:13px}
/* Sistema común de las tarjetas: mismas letras, misma línea superior y misma línea inferior */
.card .sub,.bub-l,.colb-l,.hb-l,.lg span,.c-lleva .lg{font-size:11.5px;line-height:1.25}
.card .sub,.bub-l,.colb-l,.hb-l,.lg span{font-weight:500}
.hb b,.lg b,.c-lleva .lg b{font-size:13px;font-weight:800}
.ring b,.colb b,.dn b,.c-lleva .dn b{font-size:15px;font-weight:800}
.card>.bubs,.card>.cols3{align-self:stretch}
.bubs{align-items:stretch;min-height:0}
.bub{display:grid;grid-template-rows:1fr auto;gap:6px;padding-block:0}
.bub .ring{align-self:center;margin-bottom:4px}
.cols3{align-items:stretch}
.colb{grid-template-rows:auto 1fr auto;gap:6px;padding-block:0}
.colb-t{height:auto;min-height:48px}
.card>.hbs{align-self:start;row-gap:0;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);column-gap:14px}
.hb{min-height:26px;padding-block:0}
.c-lleva .dn-w{align-items:center;align-self:center;margin-bottom:9px}
.c-lleva .lgs{gap:0}
.c-lleva .lg{min-height:26px;padding-block:0}
.dn-w .lgs{flex:1;min-width:0}
.lg-mini{font:inherit;justify-self:start;background:none;border:0;color:var(--muted);font-size:11px;text-decoration:underline;cursor:pointer;padding:0}
.bub:hover,.colb:hover,.hb:hover{background:var(--surface-2)}
.bub[aria-pressed="true"],.colb[aria-pressed="true"],.hb[aria-pressed="true"],.lg-mini[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.bub.zero,.colb.zero,.hb.zero{opacity:.45}
.planbtn{float:none!important;font:700 11.5px var(--f-body)!important;padding:7px 12px!important;border-radius:8px!important}
.plan-t{float:right;font:700 10px var(--f-body);letter-spacing:.03em;text-transform:none;color:var(--surface);background:var(--accent);border:0;border-radius:6px;padding:3px 9px;cursor:pointer}
.plan-t[aria-pressed="true"]{background:var(--fg)}
#main.plan .tbl{overflow-x:auto;scrollbar-width:none}
#main.plan .tbl::-webkit-scrollbar{display:none}
#hbar{position:fixed;bottom:0;height:16px;overflow-x:auto;overflow-y:hidden;z-index:20;background:var(--surface);border-top:1px solid var(--line)}
#hbar>div{height:1px}
#main.plan .hdr,#main.plan .row{grid-template-columns:310px 234px 2580px;gap:0;padding-inline:0;width:max-content;min-width:100%}
#main.plan .main-cell,#main.plan .c-est,#main.plan .gt{grid-column:auto;grid-row:auto}
#main.plan .main-cell,#main.plan .h-obra{padding-inline:10px;box-sizing:border-box}
#main.plan .c-est,#main.plan .hdr>span:nth-child(3){padding-inline:0 10px;box-sizing:border-box}
#main.plan .c-pr,#main.plan .c-lleva,#main.plan .c-resp,#main.plan .c-chev,#main.plan .h-pr,#main.plan .h-ll,#main.plan .h-rs,#main.plan .h-ch{display:none}
#main.plan .main-cell,#main.plan .h-obra{position:sticky;left:0;z-index:3;background:var(--surface);align-self:stretch;display:flex;align-items:center}
#main.plan .h-obra{background:var(--surface-2);justify-content:space-between}
#main.plan .c-est,#main.plan .hdr>span:nth-child(3){position:sticky;left:310px;z-index:3;background:var(--surface);align-self:stretch;display:flex;align-items:center;box-shadow:6px 0 6px -6px rgba(0,0,0,.18)}
#main.plan .hdr>span:nth-child(3){background:var(--surface-2)}
#main.plan .c-est{gap:6px}
#main.plan .c-est select{width:auto;flex:1;min-width:0}
/* dos carriles de igual altura separados por una línea: real (colores fuertes) arriba, previsto (colores claros) abajo */
.gt{height:38px}
.gt::after{content:"";position:absolute;left:0;right:0;top:19px;height:1px;background:var(--muted);opacity:.35;pointer-events:none}
.gt .g-bar{top:3px;height:15px;font-size:10px;line-height:15px;border-radius:4px}
.gt .g-over{top:3px;height:15px;border-radius:0 4px 4px 0}
.gt .g-teo{top:21px;height:15px;border-radius:4px;opacity:1}
.gt .g-prev{top:21px;height:15px;border-radius:4px;background:color-mix(in srgb,var(--muted) 10%,transparent)}
.lanes{display:grid;grid-template-rows:19px 19px;flex:none;width:52px;font:700 8.5px/19px var(--f-body);letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.lanes b{font-weight:700;overflow:hidden;white-space:nowrap;display:flex;line-height:1}
.lanes b:first-child{align-items:flex-end;padding-bottom:3px}
.lanes b:last-child{align-items:flex-start;padding-top:3px}
.lanes{position:relative}
.lanes::after{content:"";position:absolute;left:0;right:-10px;top:19px;height:1px;background:var(--muted);opacity:.35;pointer-events:none}
#main.plan .main-cell .nm{width:100%}
#main.plan .hdr{align-items:end}
#main.plan .addf{position:sticky;left:0;width:min(100%,600px)}
.gh{position:relative;display:grid;gap:1px;font-size:10px;text-transform:none;letter-spacing:0}
.gh-m,.gh-w,.gh-d{display:flex}
.gh-m span{font:700 10px var(--f-body);color:var(--fg);padding:2px 6px;border-right:2px solid var(--surface);white-space:nowrap;overflow:hidden}
.gh-w span{font-weight:600;color:var(--fg);padding:1px 3px;border-right:1px solid var(--surface);white-space:nowrap;overflow:hidden;text-align:center}
.gh-d span{width:12px;text-align:center;color:var(--muted);font-weight:600}
.gt{position:relative;height:38px;align-self:center;border-radius:4px;overflow:hidden}
.gt::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,transparent 0 11px,color-mix(in srgb,var(--line) 70%,transparent) 11px 12px),repeating-linear-gradient(90deg,transparent 0 59px,var(--line) 59px 60px);pointer-events:none}
.gtb{position:absolute;inset:0;cursor:crosshair;touch-action:none}
.g-seg{position:absolute;top:4px;bottom:4px;background:var(--plan);border-radius:3px;pointer-events:none}
.g-today{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--martin);pointer-events:none;opacity:.8}
.gh .g-today{bottom:-2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips-l{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chip{font:inherit;font-size:11px;color:var(--fg);background:var(--accent-soft);border:1px solid var(--accent);border-radius:999px;padding:3px 10px;cursor:pointer}
.chip span{color:var(--accent);margin-left:2px}
.sh-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:0 0 8px}
.sh-h h2{margin:0;font-family:var(--f-display);font-size:17px;font-weight:800;letter-spacing:-.005em;text-transform:none}
.sh-n{font-size:11px;font-weight:600;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:2px 9px}
.sh-p{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);margin-left:auto}
.pbar{width:70px;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;display:inline-block}
.pbar i{display:block;height:100%;background:var(--accent)}

.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tb{display:grid;gap:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font:600 12px var(--f-body);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tab em{font-style:normal;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.tab[aria-selected="true"] em{color:var(--surface);opacity:.8}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input[type=search],.filters select{font:inherit;font-size:12.5px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.filters input[type=search]{flex:1 1 220px}
.filters select{flex:0 1 auto}
.clear{font:600 11.5px var(--f-body);background:none;border:0;color:var(--accent);cursor:pointer;padding:6px}
.count{font-size:11.5px;color:var(--muted);margin-left:auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{padding-block:10px 60px;display:grid;gap:18px}
.sede h2{font-family:var(--f-display);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;margin:0 0 6px;display:flex;align-items:baseline;gap:10px}
.sede h2 small{font-family:var(--f-body);font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);font-size:11px}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.hdr,.row{display:grid;grid-template-columns:minmax(0,1fr) 92px 196px 190px 150px 26px;gap:10px;align-items:center;padding:7px 10px}
.hdr{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);padding-block:5px}
.item+.item{border-top:1px solid var(--line)}
.row{border-left:3px solid transparent}
.item.done .row{border-left-color:var(--accent)}
.main-cell{min-width:0;display:grid;gap:1px}
.nm{font-weight:700;font-size:13px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm{display:flex;align-items:center;gap:8px}
.nm span.t{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ed{flex:none;width:20px;height:20px;border-radius:50%;border:1px dashed var(--line);background:transparent;color:var(--muted);font:700 10px var(--f-body);cursor:pointer;padding:0;line-height:1}
.ed:hover{border-color:var(--accent)}
.ed[data-v="Pequeña"]{border:0;background:var(--p);color:var(--surface)}
.ed[data-v="Mediana"]{border:0;background:var(--m);color:var(--surface)}
.ed[data-v="Grande"]{border:0;background:var(--g);color:var(--surface)}
.ed-legend{display:inline-flex;gap:8px;align-items:center;font-size:11px;color:var(--muted)}
.ed-legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.pv{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.pv .m{color:var(--martin)}
.pv .e{color:var(--fg);font-weight:600}
.row input{font:inherit;font-size:12px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 7px;width:100%;min-width:0}
.row select{font:inherit;font-size:11.5px;font-weight:600;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:100%;min-width:0;cursor:pointer}
.row select.empty{color:var(--muted);font-weight:500}
.sh[data-v="Sí"]{background:var(--obra-soft);color:var(--obra);border-color:transparent}
.sh[data-v="No"]{background:var(--martin-soft);color:var(--martin);border-color:transparent}
.sh[data-v="A definir"]{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.es[data-v="Pendiente"]{background:var(--e1b);color:var(--e1f);border-color:transparent}
.es[data-v="Proyecto / Planificación"]{background:var(--e2b);color:var(--e2f);border-color:transparent}
.es[data-v="Presupuestación / Adjudicación"]{background:var(--e3b);color:var(--e3f);border-color:transparent}
.es[data-v="Ejecución"]{background:var(--e4b);color:var(--e4f);border-color:transparent}
.es[data-v="Post-Venta"]{background:var(--e5b);color:var(--e5f);border-color:transparent}
.es[data-v="Terminada"]{background:var(--e6b);color:var(--e6f);border-color:transparent}
.es[data-v="Suspendida"]{background:var(--e7b);color:var(--e7f);border-color:transparent}
.es[data-v="Programada"]{background:var(--e9b);color:var(--e9f);border-color:transparent}
.es[data-v="En stand by"]{background:var(--e8b);color:var(--e8f);border-color:transparent}
.pr{border-width:1.5px}
.pr[data-v="Alta"]{color:var(--martin);border-color:var(--martin);font-weight:700}
.pr[data-v="Media"]{color:var(--warn);border-color:var(--warn)}
.pr[data-v="Baja"]{color:var(--muted);border-color:var(--line)}
#fPlazo,#plazosBtn,#planTop,#sortPr{display:none!important}
#cover{position:fixed;inset:0;z-index:999;display:grid;place-items:center;align-content:center;gap:14px;background:var(--bg);color:var(--muted);font:600 13px var(--f-body);text-align:center;padding:16px}
#cover img{height:44px;opacity:.55}
#gate{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:24px;overflow:auto;background:#d9e7f8}
.gate-bg{position:absolute;inset:0;overflow:hidden}
.gate-bg::before{content:"";position:absolute;inset:-4%;background:url(fondo-acceso.jpg) 8% 78%/auto 150% no-repeat;filter:blur(6px) saturate(.8)}
.gate-bg::after{content:"";position:absolute;inset:0;background:radial-gradient(90% 70% at 12% 0%,rgba(255,255,255,.5),transparent 62%),radial-gradient(70% 60% at 100% 100%,rgba(255,255,255,.35),transparent 60%),linear-gradient(180deg,rgba(222,236,252,.62),rgba(196,216,242,.5))}
.gate-box{position:relative;z-index:2;width:clamp(290px,36vw,440px);box-sizing:border-box;background:linear-gradient(155deg,rgba(255,255,255,.78),rgba(240,246,255,.5));-webkit-backdrop-filter:blur(22px) saturate(1.25);backdrop-filter:blur(22px) saturate(1.25);border:1.5px solid rgba(255,255,255,.85);border-radius:clamp(20px,2.4vw,28px);padding:clamp(20px,5vh,40px) clamp(18px,3.6vw,48px) clamp(22px,5vh,44px);display:grid;gap:clamp(10px,1.8vh,14px);text-align:center;box-shadow:0 24px 70px rgba(30,70,130,.22),inset 0 1px 0 rgba(255,255,255,.9)}
.gate-logo{display:block;height:clamp(42px,8vh,64px);margin:0 auto}
.gate-box::before{content:"";width:44px;height:3px;background:#74b4ee;border-radius:3px;margin:clamp(4px,1.6vh,12px) auto 0;order:2}
.gate-box h1{margin:0;font:800 clamp(17px,2vw,24px) var(--f-display);color:#002c55;order:3;letter-spacing:.01em}
.gate-box p{margin:0;font-size:clamp(11px,1.05vw,14px);color:#4a6384;order:4}
.gate-fld{position:relative;order:5;margin-top:clamp(2px,1vh,8px)}
.gate-box input{width:100%;box-sizing:border-box;font:700 clamp(16px,1.6vw,20px) var(--f-display);letter-spacing:.4em;text-align:center;padding:clamp(11px,2.2vh,16px) 46px;min-width:0;border:1.5px solid rgba(255,255,255,.9);border-radius:clamp(12px,1.3vw,16px);background:rgba(255,255,255,.62);color:#002c55;box-shadow:0 6px 20px rgba(60,100,160,.12),inset 0 1px 0 rgba(255,255,255,.9)}
.gate-box input::placeholder{letter-spacing:.2em;color:#7e92ad;font-weight:600}
.gate-box input:focus{outline:2px solid #3a82d0;outline-offset:2px}
.gate-lock{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#6d83a3;pointer-events:none}
.gate-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:10px;background:none;color:#6d83a3;cursor:pointer;padding:0}
.gate-eye:hover{background:rgba(0,44,85,.08);color:#002c55}
.gate-eye svg{width:18px;height:18px}
.gate-err{order:6;min-height:16px;font-size:12px;font-weight:600;color:var(--martin)}
.gate-box button[type="submit"]{order:7;position:relative;font:700 clamp(14px,1.4vw,17px) var(--f-body);padding:clamp(11px,2.2vh,16px) 48px;border:1px solid rgba(255,255,255,.35);border-radius:clamp(12px,1.3vw,16px);background:linear-gradient(180deg,#1d4f86,#0a3466);color:#fff;cursor:pointer;display:block;text-align:center;box-shadow:0 12px 26px rgba(8,45,95,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.gate-box button[type="submit"] i{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-style:normal;display:grid}
.gate-box button[type="submit"] i svg{width:20px;height:20px}
.gate-box button[type="submit"]:disabled{opacity:.6;cursor:wait}
@media(max-width:560px){.gate-box{width:min(380px,100%)}}
.sortbtn{font:600 11.5px var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer}
.sortbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.sd{flex:none;font-size:10px;font-weight:600;color:var(--muted);background:var(--surface-2);border-radius:4px;padding:1px 6px}
.susp{margin-top:14px;padding-top:16px;border-top:2px dashed var(--line)}
.susp-t{font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--muted);background:none;border:0;padding:0;cursor:pointer}
.susp .item.no .main-cell,.susp .item.no .c-lleva,.susp .item.no .c-resp{opacity:.6}
.chev{position:relative}
.c-chev{position:relative}
.ncount{position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:var(--surface);font:700 10px/16px var(--f-body);text-align:center;padding:0 3px;pointer-events:none}
.cm.nota .tag{background:var(--accent-soft);color:var(--accent)}
.cm.nota p{color:var(--fg)}
.cm.nota .dt{color:var(--muted);font-size:11px}
.ndel{font:600 10.5px var(--f-body);color:var(--muted);background:none;border:0;padding:0 4px;cursor:pointer;text-decoration:underline}
.nform{display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:760px}
.nform select{flex:0 0 92px}
.nform .nfirma{flex:0 0 130px}
.nform .ntxt{flex:1 1 240px}
.nform select{font:inherit;font-size:11.5px;font-weight:600;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 6px}
.nform input{font:inherit;font-size:12px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
.nform button{justify-self:start;font:600 11.5px var(--f-body);color:var(--surface);background:var(--accent);border:0;border-radius:6px;padding:6px 12px;cursor:pointer}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:4px;border-top:1px dashed var(--line);margin-top:2px;padding-top:8px}
.act{font:600 11px var(--f-body);color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
.act:hover{color:var(--fg);border-color:var(--fg)}
.act.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.act.danger{background:var(--martin);border-color:var(--martin);color:var(--surface)}
.warn-t{font-size:11.5px;font-weight:600;color:var(--martin)}
.rnin{font:inherit;font-size:12.5px;color:var(--fg);background:var(--bg);border:1px solid var(--accent);border-radius:6px;padding:4px 8px;flex:1 1 260px;max-width:480px;min-width:0}
.dels{margin-top:10px}
.dels-t{font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--muted);background:none;border:0;padding:0;cursor:pointer}
.delrow{display:flex;gap:10px;align-items:center;padding:7px 12px;color:var(--muted)}
.delrow .t{flex:1;min-width:0;text-decoration:line-through}
.nmin{flex:1;min-width:0;font:700 13px var(--f-body)!important;color:var(--fg)!important;background:transparent!important;border:1px solid transparent!important;border-radius:6px;padding:3px 6px!important;margin-left:-6px;text-overflow:ellipsis}
.nmin:hover{border-color:var(--line)!important}
.nmin:focus{background:var(--bg)!important;border-color:var(--accent)!important;outline:none}
.addf{display:flex;gap:8px;align-items:center;padding:7px 10px;border-top:1px solid var(--line);background:var(--surface)}
.addf input{flex:1 1 auto;max-width:520px;min-width:0;font:inherit;font-size:12.5px;color:var(--fg);background:transparent;border:1px dashed var(--line);border-radius:6px;padding:5px 8px}
.addf input:focus{border-style:solid;border-color:var(--accent);background:var(--bg);outline:none}
.row select option{background:var(--surface);color:var(--fg)}
.item.no .main-cell,.item.no .c-lleva,.item.no .c-resp{opacity:.45}
.item.no .nmin{text-decoration:line-through;text-decoration-color:var(--muted)}
.row input::placeholder{color:var(--muted);opacity:.7}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg)}
.seg button{font:600 11px var(--f-body);color:var(--fg);background:transparent;border:0;border-right:1px solid var(--line);padding:4px 2px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--accent-soft)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.seg.env button[data-v="Pequeña"][aria-pressed="true"]{background:var(--p)}
.seg.env button[data-v="Mediana"][aria-pressed="true"]{background:var(--m)}
.seg.env button[data-v="Grande"][aria-pressed="true"]{background:var(--g)}
.chev{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;color:var(--fg);cursor:pointer;font-size:11.5px;width:26px;height:26px;padding:0;transition:transform .15s}
.chev:hover{border-color:var(--accent);color:var(--accent)}
.item.open .chev{transform:rotate(90deg)}
.item.dragging{opacity:.45}
.item.dropt{box-shadow:inset 0 3px 0 var(--accent)}
.item.dropb{box-shadow:inset 0 -3px 0 var(--accent)}
.item.open .sgt{transform:none}
.item.sgopen .sgt{transform:rotate(90deg)}
.sgt{margin-left:auto;flex:none}
.sgpanel{padding:6px 12px 12px 23px;background:var(--surface)}
.sgpanel[hidden]{display:none}
#main.plan .sgpanel{position:sticky;left:0;width:calc(var(--tw,1000px) - 12px);box-sizing:border-box}
#main.plan .sgpanel .sg{max-width:none}
#main.plan .item{width:max-content;min-width:100%}
.detail{padding:4px 12px 12px 23px;display:grid;gap:7px;background:var(--surface)}
.cm{font-size:12px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;align-items:start;max-width:860px}
.cm .tag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 5px;border-radius:4px;text-align:center}
.cm.martin .tag{background:var(--martin-soft);color:var(--martin)}
.cm.martin p{color:var(--martin)}
.cm.ot .tag{background:var(--ot-soft);color:var(--ot)}
.cm.ot p{color:var(--ot)}
.cm p{margin:0;white-space:pre-line}
.ents{display:grid;gap:6px;min-width:0}
.ent{white-space:pre-line}
.cm.martin .ent{color:var(--martin)}
.cm.ot .ent{color:var(--ot)}
.cm.nota .ent{color:var(--fg)}
.ent .dt{font-weight:600;font-size:11px;opacity:.85}
.est{display:grid;grid-template-columns:52px minmax(0,320px);gap:8px;align-items:center;font-size:11px;color:var(--muted)}
.est label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;text-align:center}
.est input{font:inherit;font-size:12px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 7px;width:100%}
.nocm{font-size:11px;color:var(--muted);font-style:italic}
.saved{font-size:10.5px;color:var(--muted);min-height:14px;padding-left:60px}
.notice{font-size:11.5px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.lbl-m{display:none}
@media (max-width:760px){
  .hdr{display:none}
  .row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 26px;row-gap:6px}
  .main-cell{grid-column:1/3}
  .chev{grid-column:3;grid-row:1}
  .c-pr{grid-column:1/2}
  .c-est{grid-column:2/4}
  .c-lleva{grid-column:1/2}
  .c-resp{grid-column:2/4}
  .detail{padding-left:13px}
}
/* ---- Seguimiento de etapas ---- */
.tk{flex:none;font:700 10.5px/1.3 var(--f-body);font-variant-numeric:tabular-nums;border-radius:999px;padding:2px 8px;border:1px solid transparent;white-space:nowrap;cursor:default}
.tk.ok,.tkc.ok{background:var(--obra-soft);color:var(--obra)}
.tk.near,.tkc.near{background:var(--warn-soft);color:var(--warn)}
.tk.late,.tkc.late{background:var(--martin-soft);color:var(--martin)}
.tk.free,.tkc.free{background:var(--surface-2);color:var(--muted)}
button.tk.nodate{background:transparent;color:var(--muted);border:1px dashed var(--line);cursor:pointer}
button.tk.nodate:hover{border-color:var(--accent);color:var(--accent)}
.tkc{font:700 10.5px/1.3 var(--f-body);border-radius:999px;padding:2px 9px;white-space:nowrap}
.tkp{display:grid;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);max-width:860px}
.tkp-h{font:700 10px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tkp-sub{font:700 10px var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.tkp-n{font-size:11.5px;color:var(--muted)}
.tkp-cur,.tkp-r{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:11.5px}
.tkp-r{border-top:1px dashed var(--line);padding-top:6px}
.tkp-e{font:700 10.5px/1.3 var(--f-body);border-radius:5px;padding:2px 8px;white-space:nowrap}
.tkp-d b{font-size:13px;font-weight:800}
.tkp-pv{display:inline-flex;align-items:center;gap:6px}
.tkp input[type=date],.tkp input[type=number],.pz input[type=number]{font:inherit;font-size:11.5px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 6px;min-width:0}
.tkp input[type=number],.pz input[type=number]{width:64px}
/* panel de plazos por etapa */
.pz{margin-top:10px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:grid;gap:10px}
.pz-h{font:700 10px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.pz-n{margin:0;font-size:11.5px;color:var(--muted);max-width:760px}
.pz-g{display:flex;flex-wrap:wrap;gap:8px 18px}
.pz-i{display:inline-flex;align-items:center;gap:8px;font-size:11.5px}
.pz-a{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:11.5px;padding-top:8px;border-top:1px dashed var(--line)}
.filters #fPlazo{font:inherit;font-size:12px}
/* barras del calendario */
.g-bar{position:absolute;top:3px;height:12px;border-radius:3px;overflow:hidden;font:700 9.5px/12px var(--f-body);padding:0 4px;white-space:nowrap;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.g-prev{position:absolute;top:17px;height:5px;border:1.5px dashed;border-radius:3px;pointer-events:none}
.g-over{position:absolute;top:3px;height:12px;background:repeating-linear-gradient(135deg,rgba(180,35,24,.9) 0 3px,rgba(255,255,255,.55) 3px 6px);border-radius:0 3px 3px 0;box-shadow:inset 0 0 0 1px rgba(180,35,24,.8)}
.plg{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:11px;color:var(--muted);padding:2px 2px 0}
.plg-t{font:700 10px var(--f-body);letter-spacing:.07em;text-transform:uppercase}
.plg-i{display:inline-flex;align-items:center;gap:6px}
.plg-i i{width:14px;height:10px;border-radius:3px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.plg-i i.pv{background:transparent;border:1.5px dashed var(--muted);height:6px;box-shadow:none}
.plg-i i.ov{background:repeating-linear-gradient(135deg,rgba(180,35,24,.9) 0 3px,rgba(255,255,255,.55) 3px 6px)}
main>.sede{min-width:0}
.tkp-note{font-size:11px;color:var(--muted)}
/* ---- panel de seguimiento (jerarquía: resumen, pestañas, tarjetas, campos con etiqueta arriba) ---- */
.sg{display:grid;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);max-width:1000px;min-width:0}
.sg-title{font:800 13px var(--f-display);color:var(--fg)}
.sg-kpis{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.sg-seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:360px;max-width:100%}
.sg-seg button{flex:1;font:700 13px var(--f-body);padding:10px 14px;border:0;background:var(--surface);color:var(--fg);cursor:pointer;text-align:center}
.sg-seg button+button{border-left:1px solid var(--line)}
.sg-seg button:hover{color:var(--fg)}
.sg-seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.sg-kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 20px;display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 20px;min-width:0}
.sg-kpi .sg-kd{border-left:1px solid var(--line);padding-left:20px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;min-width:0}
.sg-kpi .sg-seg{margin-top:0}
@media(max-width:700px){.sg-kpi .sg-kd{border-left:0;padding-left:0;width:100%}.sg-seg{width:100%}}
.sg-kpi.st-late .sg-ks{color:var(--martin);font-weight:700}
.sg-kl{font:700 10px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sg-kv{font:800 13px/1.25 var(--f-display);color:var(--fg);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sg-ks{font-size:11px;color:var(--muted);line-height:1.3}
.sg-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;background:var(--muted)}

function plazo(o){

  if(e==="Terminada") return {k:"done",inicio:op&&op.e===e?op.i:"",txt:op&&op.e===e?"Terminada el "+fmtYmd(op.i):"Terminada"};
  if(!op||op.e!==e) return {k:"nodate",txt:"Falta la fecha de inicio de la etapa"};
  const dias=Math.max(0,diasEntre(op.i,hoyS()));

  const pv=pt?diasEntre(pt.i,pt.f)+1:prevOf(a,e);

  const rest=pt?diasEntre(hoy,pt.f):(pv?pv-dias:0);
  const cab=e+" desde el "+fmtL(op.i)+": lleva "+nDias(dias)+". ";
  if(!pv&&!limVenc) return {k:"free",dias,inicio:op.i,aviso:PZ_TXT.free,txt:cab+PZ_TXT.free};

// Arma el plan hacia atrás: la última etapa con duración termina en la fecha límite
function planTeoAtras(a){
  const et=ORDEN_PLAN.filter(e=>prevOf(a,e)>0); let fin=a.limite; const t=[];
  for(let j=et.length-1;j>=0;j--){const d=prevOf(a,et[j]), i=addDias(fin,-(d-1)); t.unshift({e:et[j],i,f:fin}); fin=addDias(i,-1);}

function planTeoAdelante(a,desde){

  et.forEach(e=>{const f=addDias(i,prevOf(a,e)-1); t.push({e,i,f}); i=addDias(f,1);});

      </div>
      <div class="c-pr">${sel("pr","prioridad",PR,a.prioridad,"—","Prioridad")}</div>
      <div class="c-est">${sel("es","estado",ESTADOS,a.estado,"Estado / Etapa","Estado")}${planOpen?`<span class="lanes" aria-hidden="true"><b>Real</b><b>Previsto</b></span>`:""}</div>

      <div class="c-resp"><input id="r-${o.id}" list="people" data-id="${o.id}" data-f="responsable" value="${esc(a.responsable)}" placeholder="Responsable" aria-label="Responsable de ${esc(nom(o))}" ${canWrite?"":"disabled"}></div>

const hdr=()=>`<div class="hdr"><span class="h-obra">Obra <button type="button" class="plan-t" aria-pressed="${planOpen}">${planOpen?"◂ Cerrar planificación":"Planificación ▸"}</button></span><span class="h-pr">Prioridad</span><span>Estado / Etapa</span><span class="h-ll">Quién lo lleva</span><span class="h-rs">Responsable</span><span class="h-ch"></span>${planOpen?`<span class="h-g">${PLAN_HDR}</span>`:""}</div>`;
const isSusp=o=>asg(o).estado==="Suspendida";
// Orden manual de las obras dentro de cada sede: cada obra puede tener un número "orden"; si no lo tiene, vale su posición original x 1000
const ordOf=o=>{const v=asg(o).orden; return typeof v==="number"?v:OBRAS.indexOf(o)*1000;};
// Mueve una obra a continuación (after) o antes de otra, tomando un número entre las dos vecinas: se guarda solo esa obra
function moverObra(id,refId,after){
  const sec=document.getElementById("o-"+refId); if(!sec||id===refId) return;
  const ids=[...sec.closest(".tbl").querySelectorAll(".item[id^='o-']")].map(e=>e.id.slice(2)).filter(x=>x!==id);
  const k=ids.indexOf(refId); if(k<0) return;
  const A=after?ids[k]:ids[k-1], B=after?ids[k+1]:ids[k];
  const ord=x=>ordOf(aObra(x));
  const v=(A&&B)?(ord(A)+ord(B))/2:(A?ord(A)+1000:ord(B)-1000);
  guardar(id,{orden:v});
}
let suspOpen=true;
function sortItems(items){
  if(!state.sortPr) return items;
  const rk=o=>{const i=PR.indexOf(asg(o).prioridad);return i<0?9:i};
  return items.map((o,i)=>[o,i]).sort((x,y)=>rk(x[0])-rk(y[0])||x[1]-y[1]).map(x=>x[0]);
}
function renderList(){
  const main=document.getElementById("main");
  const vis=LIVE().filter(matches);
  const act=vis.filter(o=>!isSusp(o)), sus=vis.filter(isSusp);
  document.getElementById("count").textContent=`${vis.length} de ${LIVE().length} obras`;
  const noFilter=!state.q&&!state.resp&&!state.lleva&&!state.env&&!state.est&&!state.pr&&!state.plazo;
  let html=SEDES.map(s=>{
    if(state.sede&&state.sede!==s) return "";
    const items=sortItems(act.filter(o=>o.sede===s).sort((x,y)=>ordOf(x)-ordOf(y))); if(!items.length&&!noFilter) return "";
    const base=LIVE().filter(o=>o.sede===s&&!isSusp(o));
    const asignadas=base.filter(o=>asg(o).responsable).length;
    const addF=canWrite?`<form class="addf" data-sede="${s}"><input id="add-${s.replace(/\W/g,"")}" data-id="add" placeholder="+ Agregar obra en ${SEDE_LABEL[s]}…" aria-label="Nombre de la obra nueva en ${SEDE_LABEL[s]}" autocomplete="off"><button type="submit" class="act pri">Agregar</button></form>`:"";
    return `<section class="sede"><div class="sh-h"><h2>${SEDE_LABEL[s]}</h2><span class="sh-n">${base.length} ${base.length===1?"obra":"obras"}</span><span class="sh-p" title="${asignadas} de ${base.length} con responsable"><span class="pbar"><i style="width:${base.length?Math.round(asignadas/base.length*100):0}%"></i></span>${asignadas}/${base.length} con responsable</span></div>
      <div class="tbl">${hdr()}${items.map(o=>row(o)).join("")}${addF}</div></section>`;
  }).join("");
  if(sus.length){
    const items=sortItems(sus.slice().sort((a,b)=>SEDES.indexOf(a.sede)-SEDES.indexOf(b.sede)));
    html+=`<section class="sede susp"><h2><button type="button" class="susp-t" aria-expanded="${suspOpen}">${suspOpen?"▾":"▸"} Obras suspendidas</button> <small>${sus.length} ${sus.length===1?"obra":"obras"}</small></h2>
      <div class="tbl" ${suspOpen?"":"hidden"}>${hdr()}${items.map(o=>row(o,true)).join("")}</div></section>`;
  }
  const del=OBRAS.filter(o=>asg(o).borrada);
  if(del.length){
    html+=`<section class="sede dels"><h2><button type="button" class="dels-t" aria-expanded="${delOpen}">${delOpen?"▾":"▸"} Obras borradas</button> <small>${del.length}</small></h2>
      <div class="tbl" ${delOpen?"":"hidden"}>${del.map(o=>`<div class="item"><div class="delrow"><span class="t">${esc(nom(o))}</span><span class="sd">${SEDE_LABEL[o.sede]}</span>${canWrite?`<button type="button" class="act" data-restore="${o.id}">Restaurar</button>`:""}</div></div>`).join("")}</div></section>`;
  }
  renderChips();
  main.classList.toggle("plan",planOpen);
  const pt=document.getElementById("planTop"); pt.setAttribute("aria-pressed",planOpen); pt.textContent=planOpen?"◂ Cerrar planificación":"Ver planificación ▸";
  main.innerHTML=html||`<div class="empty">No hay obras con estos filtros.</div>`;
}

// Live re-render that preserves focus in a text field being typed in
function refreshFromStore(){
  if(painting){pendingRefresh=true; return;}
  const ae=document.activeElement;
  const focusId=ae&&ae.id&&ae.tagName==="INPUT"&&ae.dataset.id?ae.id:null;
  const val=focusId?ae.value:null, sel=focusId?[ae.selectionStart,ae.selectionEnd]:null;
  renderAll();
  if(focusId){const el=document.getElementById(focusId); if(el){el.value=val; el.focus(); try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
}

const pending={};
async function save(id,patch){
  const o=OBRAS.find(x=>x.id===id);
  const next=Object.assign({},asg(o),patch);
  const s=document.getElementById("s-"+id);
  if(!db){local[id]=next; renderStats(); updateCardState(id); if(s) s.textContent="Guardado solo en esta pantalla"; return;}
  remote[id]=next; renderStats(); updateCardState(id);
  if(s) s.textContent="Guardando…";
  // one write at a time per document
  pending[id]=(pending[id]||Promise.resolve()).then(()=>db.doc("asignaciones/"+id).set(next)).then(()=>{
    const el=document.getElementById("s-"+id); if(el) el.textContent="Guardado";
    setTimeout(()=>{const e2=document.getElementById("s-"+id); if(e2&&e2.textContent==="Guardado") e2.textContent="";},2000);
  }).catch(e=>{
    const el=document.getElementById("s-"+id);
    if(e&&e.code==="invalid_argument"){canWrite=false; showNotice("Tenés acceso de solo lectura: podés ver las asignaciones pero no cambiarlas."); renderAll();}
    else if(el) el.textContent="No se pudo guardar. Probá de nuevo.";
  });
}
function updateCardState(id){
  const o=OBRAS.find(x=>x.id===id), a=asg(o), el=document.getElementById("o-"+id);

// Arrastrar una obra para cambiarla de fila (con el agarrador ⋮⋮ de la izquierda)
let dragId=null;
function limpiarDrop(){document.querySelectorAll(".item.dropt,.item.dropb").forEach(x=>x.classList.remove("dropt","dropb"));}
let downEl=null;
document.addEventListener("mousedown",e=>{downEl=e.target;},true);
document.addEventListener("dragstart",e=>{
  const h=e.target.closest&&e.target.closest("[data-drag]"); if(!h) return;
  if(downEl&&downEl.closest&&downEl.closest("input,select,textarea,[contenteditable]")){e.preventDefault(); return;}
  dragId=h.dataset.drag; e.dataTransfer.effectAllowed="move"; try{e.dataTransfer.setData("text/plain",dragId)}catch(err){}
  const it=h.closest(".item"); if(it){try{e.dataTransfer.setDragImage(it,20,20)}catch(err){} it.classList.add("dragging");}
});
document.addEventListener("dragover",e=>{
  if(!dragId) return; const it=e.target.closest&&e.target.closest(".item[id^='o-']"); if(!it) return;
  const tbl=it.closest(".tbl"), src=document.getElementById("o-"+dragId); if(!src||src.closest(".tbl")!==tbl) return;
  e.preventDefault(); e.dataTransfer.dropEffect="move"; limpiarDrop();
  const r=it.getBoundingClientRect(); it.classList.add(e.clientY>r.top+r.height/2?"dropb":"dropt");
});
document.addEventListener("drop",e=>{
  if(!dragId) return; const it=e.target.closest&&e.target.closest(".item[id^='o-']"); const id=dragId; dragId=null;
  if(!it){limpiarDrop(); return;}
  e.preventDefault(); const after=it.classList.contains("dropb"); limpiarDrop();
  moverObra(id,it.id.slice(2),after);
});
document.addEventListener("dragend",()=>{dragId=null; limpiarDrop(); document.querySelectorAll(".item.dragging").forEach(x=>x.classList.remove("dragging"));});

    document.body.appendChild(ov);

<script>
// Ajusta la etiqueta y el título para que terminen justo en el borde derecho de la tarjeta de Envergadura
(function(){
  function fit(el,target,min,max){
    el.style.fontSize='';
    const w=el.getBoundingClientRect().width, fs=parseFloat(getComputedStyle(el).fontSize);
    if(!w||!target) return;
    el.style.fontSize=Math.max(min,Math.min(max,fs*target/w)).toFixed(2)+'px';
  }
  function run(){
    const e=document.querySelector('.eyebrow'), h=document.querySelector('h1'), b=document.querySelector('.brand-t'), c=document.querySelector('.stats > :nth-child(2)');
    if(!e||!h||!b||!c) return;
    if(innerWidth<=1200){e.style.fontSize='';h.style.fontSize='';return;}
    const target=c.getBoundingClientRect().right-b.getBoundingClientRect().left;
    fit(e,target,9,14); fit(h,target,20,46);
  }
  addEventListener('resize',run);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(run);
  addEventListener('load',run); run();
})();
</script>
<script>
// Barra de desplazamiento horizontal flotante para el calendario (pegada al borde inferior de la pantalla)
(function(){
  const bar=document.createElement('div');bar.id='hbar';bar.hidden=true;bar.innerHTML='<div></div>';document.body.appendChild(bar);
  const inner=bar.firstChild;let cur=null,lock=false;
  function pick(){
    if(!document.getElementById('main').classList.contains('plan'))return null;
    const vh=innerHeight;
    // Se muestra mientras haya algún calendario cerca de la pantalla (aunque su final ya se vea)
    for(const t of document.querySelectorAll('#main.plan .tbl')){
      const r=t.getBoundingClientRect();
      if(r.width>0&&r.top<vh-40&&r.bottom>-300&&t.scrollWidth>t.clientWidth)return t;
    }
    return null;
  }
  function allTo(x,except){document.querySelectorAll('#main.plan .tbl').forEach(t=>{if(t!==except&&Math.abs(t.scrollLeft-x)>1)t.scrollLeft=x})}
  function upd(){
    // el panel de seguimiento ocupa todo el ancho visible del calendario
    document.querySelectorAll('#main.plan .tbl').forEach(t=>{const w=t.clientWidth; if(w&&t.dataset.tw!==String(w)){t.dataset.tw=w; t.style.setProperty('--tw',w+'px')}});
    cur=pick();
    if(!cur){bar.hidden=true;return}
    const r=cur.getBoundingClientRect();
    bar.hidden=false;bar.style.left=r.left+'px';bar.style.width=r.width+'px';
    inner.style.width=cur.scrollWidth+'px';
    if(Math.abs(bar.scrollLeft-cur.scrollLeft)>1)bar.scrollLeft=cur.scrollLeft;
  }
  bar.addEventListener('scroll',()=>{
    if(cur&&!lock&&Math.abs(cur.scrollLeft-bar.scrollLeft)>1){lock=true;allTo(bar.scrollLeft);requestAnimationFrame(()=>{lock=false})}
  });
  document.addEventListener('scroll',e=>{
    const t=e.target;
    if(!t||!t.classList||!t.classList.contains('tbl'))return;
    if(Math.abs(bar.scrollLeft-t.scrollLeft)>1)bar.scrollLeft=t.scrollLeft;
    allTo(t.scrollLeft,t);
  },true);
  addEventListener('scroll',upd,{passive:true});addEventListener('resize',upd);
  new MutationObserver(()=>requestAnimationFrame(upd)).observe(document.getElementById('main'),{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
  setInterval(upd,400);
  upd();
})();
</script>

/* Colores de Mejoras: azul UCC (--total-bg) y celeste (--plan), verde para "hecha", rojo para borrar */
#mj{overflow:clip;background:linear-gradient(165deg,color-mix(in srgb,var(--plan) 17%,var(--surface)),var(--surface) 62%)}
#mj::before,#mj::after{background:color-mix(in srgb,var(--plan) 15%,transparent)}
.mj-fld svg,.mj-cin svg{color:var(--plan)}
#mj input[type=text]:focus,#mj textarea:focus{border-color:var(--plan);box-shadow:0 0 0 3px color-mix(in srgb,var(--plan) 22%,transparent)}
.mj-b{background:var(--total-bg);color:#fff}
.mj-g{background:color-mix(in srgb,var(--plan) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--plan) 40%,transparent)}
.mj-i{border-color:color-mix(in srgb,var(--plan) 28%,var(--line))}
.mj-top{background:color-mix(in srgb,var(--plan) 13%,var(--surface))}
.mj-i.ok .mj-top{background:color-mix(in srgb,var(--obra) 14%,var(--surface))}
.mj-acc .mj-hecha{color:var(--obra);background:var(--obra-soft);border-color:color-mix(in srgb,var(--obra) 40%,transparent)}
.mj-c{background:color-mix(in srgb,var(--plan) 7%,var(--surface));border-color:color-mix(in srgb,var(--plan) 22%,var(--line))}
.mj-c small b{color:var(--accent)}
#mj-tab{background:var(--total-bg)}
#mj-tab b{background:var(--plan);color:#04223a}
</style>
<button id="mj-tab" type="button" hidden aria-expanded="false" aria-controls="mj">Mejoras <b id="mj-n">0</b></button>
<aside id="mj" hidden aria-label="Mejoras de la interfaz">
  <div class="mj-h"><div class="mj-ht"><h2>Mejoras de la página</h2><p class="mj-sub">Escribí una idea para mejorar la página. La ven todos.</p></div><button class="mj-x" type="button" id="mj-cerrar" aria-label="Cerrar">×</button></div>
  <form class="mj-new" id="mj-form">
    <div class="mj-fld"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><input type="text" id="mj-nom" maxlength="60" placeholder="Tu nombre" aria-label="Tu nombre" autocomplete="name"></div>
    <div class="mj-fld"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.7 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><textarea id="mj-txt" maxlength="500" placeholder="Ej: que el calendario se vea más grande" aria-label="Nueva mejora"></textarea></div>
    <div class="mj-fotos" id="mj-prev"></div>
    <div class="mj-err" id="mj-err" role="alert"></div>
    <div class="mj-row">
      <button type="button" class="mj-g" id="mj-fbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 9"/></svg>+ Foto</button>
      <button type="submit" class="mj-b" id="mj-add"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8zM19 14l.9 2.6L22.5 17.5l-2.6.9L19 21l-.9-2.6-2.6-.9 2.6-.9z"/></svg>Agregar</button>
    </div>
    <input type="file" id="mj-file" accept="image/*" hidden>
  </form>
  <div class="mj-l" id="mj-lista"></div>
</aside>
<script>
// Panel lateral de mejoras. Cada mejora es un documento de la colección "mejoras" en Firestore:
//   t (texto), f (fecha), ok (hecha), n (nombre), fotos {id: foto}, coms {id: {t, n, f}}.
// Las fotos se achican en el navegador y se guardan dentro del documento. Fotos y comentarios son campos
// propios, así dos personas escribiendo a la vez no se pisan.
window.initMejoras=function(db){
  const col=db.collection("mejoras"), $=id=>document.getElementById(id), FV=firebase.firestore.FieldValue;
  const tab=$("mj-tab"), pan=$("mj"); let items={}, nuevas=[], borr={}; const MAXF=4;
  const abrir=v=>{pan.classList.toggle("open",v); tab.setAttribute("aria-expanded",v); tab.hidden=v; if(!v) alinear(); try{localStorage.setItem("mj-open",v?"1":"")}catch(e){}};
  const aviso=()=>showNotice("No se pudo guardar. Probá de nuevo (si sigue fallando, avisá: puede faltar publicar las reglas nuevas en Firebase).");
  const dia=ms=>new Date(ms).toLocaleDateString("es-AR",{day:"numeric",month:"short"});
  const nombre=()=>{let n=$("mj-nom").value.trim().slice(0,60); try{localStorage.setItem("obras-firma",n)}catch(e){} return n;};
  const nid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  try{$("mj-nom").value=localStorage.getItem("obras-firma")||""}catch(e){}

  // Achica la foto (lado mayor 1000 px, JPEG) para que entre en la base
  function achicar(file){return new Promise((ok,mal)=>{const u=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{URL.revokeObjectURL(u); const k=Math.min(1,1000/Math.max(im.width,im.height)), c=document.createElement("canvas");
      c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      let q=.75, d=c.toDataURL("image/jpeg",q); while(d.length>180000&&q>.35){q-=.1; d=c.toDataURL("image/jpeg",q);} d.length>180000?mal():ok(d);};
    im.onerror=()=>{URL.revokeObjectURL(u); mal();}; im.src=u;});}
  function elegirFoto(){return new Promise(res=>{const f=$("mj-file"); f.value=""; f.onchange=async()=>{const x=f.files[0]; if(!x) return res(null); try{res(await achicar(x))}catch(e){showNotice("No se pudo usar esa foto. Probá con otra."); res(null)}}; f.click();});}

  function pintar(){
    const act=document.activeElement, keep=act&&act.dataset&&act.dataset.c?{i:act.dataset.c,s:act.selectionStart}:null;
    document.querySelectorAll("#mj-lista [data-c]").forEach(e=>{borr[e.dataset.c]=e.value;});
    const ids=Object.keys(items).sort((a,b)=>(items[a].ok-items[b].ok)||(items[b].f-items[a].f));
    $("mj-n").textContent=ids.filter(i=>!items[i].ok).length;
    $("mj-lista").innerHTML=ids.length?ids.map(i=>{const x=items[i], fs=Object.entries(x.fotos).sort((a,b)=>a[0]<b[0]?-1:1), cs=Object.entries(x.coms).sort((a,b)=>a[1].f-b[1].f);
      return `<div class="mj-i${x.ok?" ok":""}"><div class="mj-top">
      ${fs.length?`<div class="mj-fotos">${fs.map(([k,d])=>`<div class="mj-ft"><img src="${d}" alt="Foto" data-z="1"><button class="mj-q" data-a="qf" data-i="${esc(i)}" data-k="${esc(k)}" aria-label="Quitar foto">×</button></div>`).join("")}</div>`:""}
      <div class="mj-info"><div class="mj-t">${esc(x.t)}</div><div class="mj-m">${x.n?esc(x.n)+" · ":""}${dia(x.f)}${x.ok?" · hecha":""}</div>
        <div class="mj-acc"><button class="mj-hecha" data-a="ok" data-i="${esc(i)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>${x.ok?"Reabrir":"Marcar hecha"}</button><button class="mj-borrar" data-a="del" data-i="${esc(i)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>Borrar</button></div></div></div>
      <div class="mj-cs">${cs.map(([k,c])=>`<div class="mj-c"><small><b>${esc(c.n||"Alguien")}</b>${dia(c.f)}<button data-a="qc" data-i="${esc(i)}" data-k="${esc(k)}" aria-label="Borrar comentario">×</button></small><p>${esc(c.t)}</p></div>`).join("")}
        <div class="mj-cf"><div class="mj-cin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.7 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><input type="text" maxlength="500" placeholder="Escribir un comentario…" aria-label="Comentario" data-c="${esc(i)}" value="${esc(borr[i]||"")}"></div><button class="mj-b" data-a="com" data-i="${esc(i)}">Enviar</button></div></div></div>`}).join(""):'<div class="mj-vacio">Todavía no hay mejoras anotadas.</div>';
    if(keep){const e=document.querySelector(`#mj-lista [data-c="${CSS.escape(keep.i)}"]`); if(e){e.focus(); try{e.setSelectionRange(keep.s,keep.s)}catch(_){}}}
  }
  function pintarPrev(){$("mj-prev").innerHTML=nuevas.map((d,k)=>`<div class="mj-ft"><img src="${d}" alt="Foto a agregar"><button type="button" class="mj-q" data-n="${k}" aria-label="Quitar foto">×</button></div>`).join(""); $("mj-fbtn").hidden=nuevas.length>=MAXF;}

  col.onSnapshot(s=>{items={}; s.docs.forEach(d=>{const v=d.data(); if(!v||typeof v.t!=="string") return;
      const m=o=>(o&&typeof o==="object")?o:{};
      items[d.id]={t:v.t,f:+v.f||0,ok:v.ok===true,n:typeof v.n==="string"?v.n:"",
        fotos:Object.fromEntries(Object.entries(m(v.fotos)).filter(([k,x])=>typeof x==="string"&&x.startsWith("data:image/"))),
        coms:Object.fromEntries(Object.entries(m(v.coms)).filter(([k,x])=>x&&typeof x.t==="string").map(([k,x])=>[k,{t:x.t,n:typeof x.n==="string"?x.n:"",f:+x.f||0}]))};});
    pintar();},()=>{});
  tab.hidden=false; pan.hidden=false;
  // La pestaña toma la posición y el alto de la fila de tarjetas de arriba
  const st=document.getElementById("stats");
  function alinear(){const r=st.getBoundingClientRect(); if(!r.height) return; tab.style.top=(r.top+scrollY)+"px"; tab.style.height=r.height+"px";}
  alinear(); addEventListener("resize",alinear); addEventListener("load",alinear);
  if(window.ResizeObserver) new ResizeObserver(alinear).observe(st);
  tab.onclick=()=>{abrir(true); $("mj-txt").focus();};
  $("mj-cerrar").onclick=()=>abrir(false);
  document.addEventListener("keydown",e=>{if(e.key==="Escape"){const z=$("mj-zoom"); if(z) z.remove(); else if(pan.classList.contains("open")) abrir(false);}});
  $("mj-fbtn").onclick=async()=>{const d=await elegirFoto(); if(d){nuevas.push(d); pintarPrev();}};
  // Pegar una captura o imagen copiada (Ctrl+V) dentro del formulario de arriba
  $("mj-form").addEventListener("paste",async e=>{
    const fs=[...(e.clipboardData&&e.clipboardData.files||[])].filter(f=>f.type.startsWith("image/")); if(!fs.length) return;
    e.preventDefault();
    for(const f of fs){ if(nuevas.length>=MAXF){$("mj-err").textContent="Máximo "+MAXF+" fotos por idea."; break;}
      try{nuevas.push(await achicar(f)); pintarPrev();}catch(x){showNotice("No se pudo usar esa imagen. Probá con otra.");} }});
  $("mj-prev").onclick=e=>{const b=e.target.closest("[data-n]"); if(b){nuevas.splice(+b.dataset.n,1); pintarPrev();}};
  $("mj-form").onsubmit=async e=>{e.preventDefault(); const t=$("mj-txt").value.trim(), er=$("mj-err"); er.textContent="";
    if(!t){er.textContent="Escribí la idea."; return;} const n=nombre(); if(!n){er.textContent="Poné tu nombre."; $("mj-nom").focus(); return;}
    const b=$("mj-add"); b.disabled=true;
    const fotos={}; nuevas.forEach((d,k)=>{fotos[nid("f")+k]=d;});
    try{await col.doc(nid("m")).set({t,n,f:Date.now(),ok:false,fotos,coms:{}}); $("mj-txt").value=""; nuevas=[]; pintarPrev();}catch(x){aviso();}
    b.disabled=false;};
  $("mj-lista").onclick=async e=>{
    if(e.target.dataset.z){const z=document.createElement("div"); z.id="mj-zoom"; z.innerHTML=`<img src="${e.target.src}" alt="Foto">`; z.onclick=()=>z.remove(); document.body.appendChild(z); return;}
    const b=e.target.closest("button[data-a]"); if(!b) return; const i=b.dataset.i, a=b.dataset.a, ref=col.doc(i), k=b.dataset.k;
    try{
      if(a==="ok") await ref.update({ok:!items[i].ok});
      else if(a==="del"){ if(confirm("¿Borrar esta mejora con sus fotos y comentarios?")) await ref.delete(); }
      else if(a==="qf"){ if(confirm("¿Quitar esta foto?")) await ref.update({["fotos."+k]:FV.delete()}); }
      else if(a==="qc"){ if(confirm("¿Borrar este comentario?")) await ref.update({["coms."+k]:FV.delete()}); }
      else if(a==="foto"){ const d=await elegirFoto(); if(d) await ref.update({["fotos."+nid("f")]:d}); }
      else if(a==="com"){ const inp=document.querySelector(`#mj-lista [data-c="${CSS.escape(i)}"]`), t=inp.value.trim(); if(!t) return;
        let n=$("mj-nom").value.trim(); if(!n){$("mj-nom").focus(); $("mj-err").textContent="Poné tu nombre para comentar."; return;} n=nombre();
        inp.value=""; delete borr[i]; await ref.update({["coms."+nid("c")]:{t:t.slice(0,500),n,f:Date.now()}}).catch(x=>{borr[i]=t; throw x;}); }
    }catch(x){aviso();}};
  $("mj-lista").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset.c){e.preventDefault(); e.target.closest(".mj-cf").querySelector("[data-a=com]").click();}});
  try{ if(localStorage.getItem("mj-open")==="1" && innerWidth>760) abrir(true); }catch(e){}
};
</script>
</body></html>
